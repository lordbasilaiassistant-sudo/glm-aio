name = "glm-aio"
main = "worker/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Autonomous off-PC engine: every 5 min works queued jobs; daily noon UTC the CFO
# compiles the verification report for the investors. (Cron only fires when deployed.)
[triggers]
crons = ["*/5 * * * *", "0 12 * * *"]

[vars]
CRON_JOBS_PER_TICK = "3"

# Memory + job queue + status store.
[[kv_namespaces]]
binding = "GLM_KV"
id = "b3e06d071bc74332b47b1cfc94be45d6"

# Secrets (set, do NOT put in this file):
#   wrangler secret put ZAI_API_KEY
#   wrangler secret put GATEWAY_TOKEN
